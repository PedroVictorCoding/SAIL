name: Public file safety
on: [push, pull_request]
permissions:
  contents: read
jobs:
  publication-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/check_public_files.py
