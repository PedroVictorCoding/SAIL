# cargo-deny policy for the SAIL workspace. CI runs `cargo deny check` on every PR.
#
# Why: the master vision (§15 Step 2, Appendix C) requires every new dependency's license
# and maturity to be checked before reuse. This file makes that check mechanical: a PR that
# adds a crate with an unlisted license, a known vulnerability, or a non-crates.io source
# fails CI until someone records the decision here.
#
# To allow a new license, add it below together with a comment naming the crate that needs it.

[graph]
targets = ["x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# RustSec advisories. Vulnerabilities and unsound crates fail. An exception needs an
# `ignore = [{ id = "RUSTSEC-…", reason = "…" }]` entry with a concrete reason.
yanked = "deny"
# "Unmaintained" notices fail only for crates SAIL depends on directly. Transitive ones
# (today: rustls-pemfile via axum-server; zvariant/zbus_names via the keyring's zbus) are
# reported upstream and fixed by updating the direct dependency.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
# Permissive licenses only. Copyleft (GPL/AGPL/LGPL-only, SSPL) is not allowed as a
# dependency; see the vision's notes on Notte (SSPL) and LearnHarness (AGPL).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "BSL-1.0",
    "Unlicense",
    "Unicode-3.0",
    # webpki-roots: Mozilla's CA root list.
    "CDLA-Permissive-2.0",
]

[licenses.private]
# Workspace crates are not published; they are still checked against `allow`.
ignore = false

[bans]
# Duplicate versions are common in an async/TLS tree (base64, digest, der …); not checked.
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies between workspace crates are fine.
allow-wildcard-paths = true

[sources]
# Only crates.io. A git or alternative-registry dependency must be added here deliberately.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
